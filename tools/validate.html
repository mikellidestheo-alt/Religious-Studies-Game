<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Confessional | Dilemma checker</title>
  <style>
    :root { --bg: #1a1428; --cream: #f8f0e0; --ink: #2a2030; --red: #8a2236; --green: #1c6234; }
    body {
      margin: 0;
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      background: var(--bg);
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { max-width: 46em; }
    pre {
      background: var(--cream);
      color: var(--ink);
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 14px;
      line-height: 1.45;
    }
    .pass { color: #9fe0b3; }
    .fail { color: #ffb3bd; }
  </style>
</head>
<body>
  <h1>Dilemma checker</h1>
  <p>This page checks every dilemma loaded below. It is the browser version of <code>node tools/validate.js</code>. If you add a new dilemma file, add a script tag for it here and in <code>index.html</code>.</p>
  <p id="summary"></p>
  <pre id="out">Checking...</pre>

  <script src="../js/spec.js"></script>
  <script src="../js/dilemmas/p1-s1.js"></script>
  <script src="../js/dilemmas/p1-s2.js"></script>
  <script src="../js/dilemmas/p1-s3.js"></script>
  <script src="../js/dilemmas/p1-s4.js"></script>
  <script src="../js/dilemmas/p2-s1.js"></script>
  <script src="../js/dilemmas/p2-s2.js"></script>
  <script src="../js/dilemmas/p2-s3.js"></script>
  <script src="validate-core.js"></script>
  <script>
    (function () {
      var result = window.ConfessionalValidator.validate(window.DILEMMAS || [], window.SPEC);
      document.getElementById('out').textContent = window.ConfessionalValidator.report(result, window.SPEC, 3);
      var s = document.getElementById('summary');
      s.className = result.errors.length ? 'fail' : 'pass';
      s.textContent = result.errors.length ?
        result.errors.length + ' error(s) found. Fix them before publishing.' :
        'All ' + result.total + ' dilemmas passed. Warnings (if any) are listed below.';
    })();
  </script>
</body>
</html>
